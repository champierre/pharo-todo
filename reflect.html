<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Pharo Live Reflection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            background-attachment: fixed;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .subtitle {
            font-size: 1.1em;
            color: #b0b0b0;
            font-style: italic;
            margin-bottom: 15px;
        }

        .back-link {
            display: inline-block;
            color: #e94560;
            text-decoration: none;
            padding: 8px 16px;
            border: 2px solid #e94560;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-link:hover {
            background: #e94560;
            color: white;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        .browser {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 15px;
            margin-bottom: 20px;
            height: 500px;
        }

        .panel {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(233, 69, 96, 0.2);
            transition: border-color 0.3s ease;
        }

        .panel:hover {
            border-color: rgba(233, 69, 96, 0.4);
        }

        .panel-header {
            background: rgba(233, 69, 96, 0.15);
            padding: 12px 15px;
            font-weight: 600;
            color: #e94560;
            border-bottom: 2px solid #e94560;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* Custom scrollbar */
        .panel-content::-webkit-scrollbar {
            width: 8px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .panel-content::-webkit-scrollbar-thumb {
            background: rgba(233, 69, 96, 0.4);
            border-radius: 4px;
        }

        .panel-content::-webkit-scrollbar-thumb:hover {
            background: rgba(233, 69, 96, 0.6);
        }

        .class-item, .method-item {
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .class-item:hover, .method-item:hover {
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .class-item.selected, .method-item.selected {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .class-name, .method-name {
            font-weight: 500;
            color: #ffffff;
            font-size: 1em;
        }

        .class-meta, .method-protocol {
            font-size: 0.85em;
            color: #888;
            margin-top: 3px;
        }

        .method-section {
            margin-bottom: 15px;
        }

        .method-section-title {
            font-size: 0.9em;
            color: #e94560;
            font-weight: 600;
            margin-bottom: 8px;
            padding: 6px 8px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 4px;
            border-left: 3px solid #e94560;
        }

        .source-code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #d4d4d4;
        }

        .class-info {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .class-info h3 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .info-section {
            margin-bottom: 15px;
        }

        .info-label {
            color: #e94560;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .info-value {
            color: #b0b0b0;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.95em;
        }

        .superclass-chain {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .superclass-chain span {
            color: #b0b0b0;
        }

        .superclass-chain .arrow {
            color: #e94560;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        /* Syntax highlighting colors */
        .st-keyword { color: #e94560; font-weight: 500; }
        .st-string { color: #4ec9b0; }
        .st-comment { color: #6a9955; font-style: italic; }
        .st-symbol { color: #ce9178; }
        .st-number { color: #b5cea8; }
        .st-special { color: #c586c0; font-weight: 500; }
        .st-tempvar { color: #dcdcaa; }
        .st-assign { color: #ffffff; font-weight: bold; }

        @media (max-width: 1200px) {
            .browser {
                grid-template-columns: 1fr;
                height: auto;
            }

            .panel {
                height: 300px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Pharo Live Reflection</h1>
            <div class="subtitle">実行中のアプリが自分自身を映す</div>
            <a href="/" class="back-link">← TODOアプリに戻る</a>
        </header>

        <div class="browser">
            <div class="panel">
                <div class="panel-header">TodoApp :: Classes</div>
                <div class="panel-content" id="classList">
                    <div class="loading">Loading classes...</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Methods</div>
                <div class="panel-content" id="methodList">
                    <div class="empty-state">Select a class to view methods</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Source Code</div>
                <div class="panel-content" id="sourceView">
                    <div class="empty-state">Select a method to view source code</div>
                </div>
            </div>
        </div>

        <div class="class-info" id="classInfo" style="display: none;">
            <h3 id="classInfoName">Class Name</h3>
            <div class="info-section">
                <div class="info-label">Superclass Chain:</div>
                <div class="info-value">
                    <div class="superclass-chain" id="superclassChain"></div>
                </div>
            </div>
            <div class="info-section">
                <div class="info-label">Instance Variables:</div>
                <div class="info-value" id="instanceVars"></div>
            </div>
            <div class="info-section">
                <div class="info-label">Class Variables:</div>
                <div class="info-value" id="classVars"></div>
            </div>
        </div>
    </div>

    <script>
        // State
        let classes = [];
        let selectedClass = null;
        let selectedMethod = null;
        let classDetails = null;

        // Initialize
        async function init() {
            await loadClasses();
        }

        // Load classes from API
        async function loadClasses() {
            try {
                const response = await fetch('/api/reflect/classes');
                classes = await response.json();
                renderClasses();
            } catch (error) {
                document.getElementById('classList').innerHTML = 
                    '<div class="empty-state">Error loading classes: ' + error.message + '</div>';
            }
        }

        // Render class list
        function renderClasses() {
            const classList = document.getElementById('classList');
            if (classes.length === 0) {
                classList.innerHTML = '<div class="empty-state">No classes found</div>';
                return;
            }

            classList.innerHTML = classes.map(cls => `
                <div class="class-item fade-in" data-class="${cls.name}" onclick="selectClass('${cls.name}')">
                    <div class="class-name">${cls.name}</div>
                    <div class="class-meta">⇐ ${cls.superclass} • ${cls.methodCount} methods</div>
                </div>
            `).join('');
        }

        // Select a class
        async function selectClass(className) {
            selectedClass = className;
            selectedMethod = null;

            // Update UI selection
            document.querySelectorAll('.class-item').forEach(item => {
                item.classList.toggle('selected', item.dataset.class === className);
            });

            // Load class details
            document.getElementById('methodList').innerHTML = '<div class="loading">Loading methods...</div>';
            document.getElementById('sourceView').innerHTML = '<div class="empty-state">Select a method to view source code</div>';

            try {
                const response = await fetch(`/api/reflect/class/${className}`);
                classDetails = await response.json();
                renderMethods();
                renderClassInfo();
            } catch (error) {
                document.getElementById('methodList').innerHTML = 
                    '<div class="empty-state">Error loading methods: ' + error.message + '</div>';
            }
        }

        // Render method list
        function renderMethods() {
            const methodList = document.getElementById('methodList');
            if (!classDetails) {
                methodList.innerHTML = '<div class="empty-state">No class selected</div>';
                return;
            }

            let html = '';

            // Instance methods
            if (classDetails.instanceMethods && classDetails.instanceMethods.length > 0) {
                html += '<div class="method-section">';
                html += '<div class="method-section-title">📘 Instance Methods</div>';
                classDetails.instanceMethods.forEach(method => {
                    html += `
                        <div class="method-item fade-in" 
                             data-method="${method.selector}" 
                             data-side="instance"
                             onclick="selectMethod('${method.selector}', 'instance')">
                            <div class="method-name">${method.selector}</div>
                            <div class="method-protocol">${method.protocol}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Class methods
            if (classDetails.classMethods && classDetails.classMethods.length > 0) {
                html += '<div class="method-section">';
                html += '<div class="method-section-title">📗 Class Methods</div>';
                classDetails.classMethods.forEach(method => {
                    html += `
                        <div class="method-item fade-in" 
                             data-method="${method.selector}" 
                             data-side="class"
                             onclick="selectMethod('${method.selector}', 'class')">
                            <div class="method-name">${method.selector}</div>
                            <div class="method-protocol">${method.protocol}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            if (html === '') {
                html = '<div class="empty-state">No methods found</div>';
            }

            methodList.innerHTML = html;
        }

        // Select a method
        async function selectMethod(selector, side) {
            selectedMethod = selector;

            // Update UI selection
            document.querySelectorAll('.method-item').forEach(item => {
                item.classList.toggle('selected', 
                    item.dataset.method === selector && item.dataset.side === side);
            });

            // Load method source
            document.getElementById('sourceView').innerHTML = '<div class="loading">Loading source code...</div>';

            try {
                const className = side === 'class' ? selectedClass + ' class' : selectedClass;
                const response = await fetch(`/api/reflect/method/${encodeURIComponent(className)}/${encodeURIComponent(selector)}`);
                const methodData = await response.json();
                renderSource(methodData.source);
            } catch (error) {
                document.getElementById('sourceView').innerHTML = 
                    '<div class="empty-state">Error loading source: ' + error.message + '</div>';
            }
        }

        // Render source code with syntax highlighting
        function renderSource(source) {
            const highlighted = highlightSmalltalk(source);
            document.getElementById('sourceView').innerHTML = 
                `<pre class="source-code fade-in">${highlighted}</pre>`;
        }

        // Syntax highlighting for Smalltalk
        function highlightSmalltalk(code) {
            // Escape HTML first
            code = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Comments "..."
            code = code.replace(/"([^"]*)"/g, '<span class="st-comment">"$1"</span>');

            // Strings '...'
            code = code.replace(/'([^']*)'/g, '<span class="st-string">\'$1\'</span>');

            // Symbols #something
            code = code.replace(/#\w+/g, '<span class="st-symbol">$&</span>');

            // Numbers
            code = code.replace(/\b\d+(\.\d+)?\b/g, '<span class="st-number">$&</span>');

            // Special keywords
            const special = ['self', 'super', 'true', 'false', 'nil', '\\^'];
            special.forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, 'g');
                code = code.replace(regex, `<span class="st-special">${word}</span>`);
            });

            // Assignment
            code = code.replace(/:=/g, '<span class="st-assign">:=</span>');

            // Temp variables |...|
            code = code.replace(/\|([^|]*)\|/g, (match, vars) => {
                return `<span class="st-tempvar">|${vars}|</span>`;
            });

            // Common keywords (message sends)
            const keywords = [
                'ifTrue:', 'ifFalse:', 'ifNil:', 'ifNotNil:', 'whileTrue:', 'whileFalse:',
                'do:', 'collect:', 'select:', 'reject:', 'detect:', 'inject:into:',
                'timesRepeat:', 'to:do:', 'to:by:do:', 'at:', 'at:put:', 'add:', 'remove:',
                'new', 'new:', 'yourself', 'copy', 'value', 'value:', 'value:value:',
                'printOn:', 'printString', 'asString', 'with:', 'title:'
            ];
            keywords.forEach(keyword => {
                const escaped = keyword.replace(/:/g, '\\:');
                const regex = new RegExp(`\\b${escaped}\\b`, 'g');
                code = code.replace(regex, `<span class="st-keyword">${keyword}</span>`);
            });

            return code;
        }

        // Render class info
        function renderClassInfo() {
            if (!classDetails) {
                document.getElementById('classInfo').style.display = 'none';
                return;
            }

            document.getElementById('classInfo').style.display = 'block';
            document.getElementById('classInfo').classList.add('fade-in');
            document.getElementById('classInfoName').textContent = classDetails.name;

            // Superclass chain
            const chain = document.getElementById('superclassChain');
            const fullChain = [classDetails.name, classDetails.superclass, ...(classDetails.superclassChain || [])];
            chain.innerHTML = fullChain.map((cls, idx) => {
                if (idx === fullChain.length - 1) {
                    return `<span>${cls}</span>`;
                } else {
                    return `<span>${cls}</span><span class="arrow">⇐</span>`;
                }
            }).join('');

            // Instance variables
            const instVars = classDetails.instanceVariables || [];
            document.getElementById('instanceVars').textContent = 
                instVars.length > 0 ? instVars.join(', ') : '(none)';

            // Class variables
            const clsVars = classDetails.classVariables || [];
            document.getElementById('classVars').textContent = 
                clsVars.length > 0 ? clsVars.join(', ') : '(none)';
        }

        // Start the app
        init();
    </script>
</body>
</html>
